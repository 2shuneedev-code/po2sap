  ZSHCO:   { from: const, value: "", todo: "출하조건 확인 필요" }
  ZPKRE1:  { from: const, value: "" }
  MATNR:   { from: const, value: "", explain: "발주서에 우리 품번이 없어 비운다 (검수 화면에서 입력)" }
  MAKTX:   { from: const, value: "" }
