[project]
name = "po2sap"
version = "0.1.0"
description = "발주서(PDF/HTM) → Claude 추출 → 규칙엔진 → 검수 → EAI(JSON) 전송 → SAP CBO"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.dynamic]
dependencies = { file = ["backend/requirements.txt"] }

# 이 저장소는 배포 패키지가 아니라 **그 자리에서 실행하는 앱**이다
# (`streamlit run po2sap.py`). 루트에 backend/·ui/·masters/·scripts/ 가
# 나란히 있어 setuptools 자동 탐색이 실패하므로 탐색을 끈다.
# 개발 도구는 `pip install -r backend/requirements-dev.txt` 로 받는다.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "storage"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # 줄 길이는 line-length 로만 본다 (한글 주석 정렬 때문)
    "SIM108",  # 삼항 강제는 가독성을 해치는 경우가 있다
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["E402"]     # 테스트는 경로 세팅 후 import 하는 경우가 있다
"scripts/*" = ["E402"]           # sys.path 조정 후 import (파일 상단에 명시)
