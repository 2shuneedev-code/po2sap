# ═══════════════════════════════════════════════════════════════
#  전 거래처 공통 SAP 기본값 / 필드 스펙
#  원천: masters/templates/SALES ORDER.xlsx  (2026-09-30 현업 수정본 반영)
#  ※ 필드 증감은 이 파일만 고치면 전 거래처·화면·전송에 반영된다.
# ═══════════════════════════════════════════════════════════════

# ── 전 거래처 공통 고정값 (명세서 §4.2 "공통 고정값") ──────────
sap_defaults:
  AUART: "ZEXP"      # 확정 (기존 운영 결과지 전량 ZEXP)
  VKORG: "1000"      # 확정

# ── 추출 기본값 — 큰 문서를 몇 번에 나눠 읽을지 (SCHEMA.md §4.2 chunking) ──
#  문서 1건이 LLM 1회 호출의 **출력** 한도를 넘으면 구간으로 나눠 부른다.
#  거래처는 바꾸고 싶은 키만 `extraction.chunking` 에 적는다 — 여기만 키 단위로 합쳐진다.
#  경계 기준은 선언하지 않는다. `split.by` 가 정한다.
extraction_defaults:
  chunking:
    enabled: true
    max_lines_per_chunk: 120     # 청크 하나에 담을 전처리 텍스트 줄 수 상한
    tokens_per_line: 80          # 품목 1줄이 만들어내는 출력 토큰 추정치
    safety_ratio: 0.7            # max_tokens 대비 실제로 쓸 비율
    header_context_lines: 40     # 청크에 함께 붙여 보낼 문서 앞머리 줄 수

# ── SAP 전송 필드 ──────────────────────────────────────────────
#  순서 = 업로드 양식 컬럼 순서. label = 양식의 영문 헤더.
#
#  2026-09-21 현업 확정본(SALES ORDER 템플릿) 반영 — 36 → 28.
#  뺀 8개: VTWEG · VBELN · ZPKRE1 · MAKTX · LGORT · BATCH · VALTY · BSTKD_E
#  2026-09-30 템플릿 수정 — POSEX 를 BSTKD 옆으로 옮기고 KDMAT(YOUR CODE) 추가.
#  2026-10-02 KUNNR3(END CUSTOM · 최종고객) 삭제 — 사용자 결정. 전송에서도 뺀다.
#  2026-10-02 검수 표에 숨겨 두던 12개 삭제 — 보낼 필요 없음(사용자 결정). 필요하면 다시 추가:
#    VDATU · ZTERM · INCO1 · INCO2 · ETDAT · BSTDK_E · DELCO · AUGRU · VKAUS · IHREZ_E · VGBEL · VGPOS
#    (PRICE · WAERK 는 같은 날 되살렸다 — 검수 표에 보인다)
#
#  ※ 템플릿 리더가 붙으면 **템플릿 2행이 이 목록을 대신한다.** 그때까지는
#    여기가 유효 필드 목록이다 (NEXT.md §2-D).
#
#  `code` — 화면에 보이는 SAP 필드 코드가 키와 다를 때만. 전송 키는 그대로 왼쪽 키다.
#    (KUNNR1 은 화면에 KUNNR 로 보이지만 EAI 로는 KUNNR1 로 나간다)
#
#  `send_only: true` — 전송(EAI)에만 들어가고 검수 표·규칙 카드에는 안 보인다.
#    사람이 볼 일도 고칠 일도 없는 값(판매조직 등)을 표에서 치운다.
field_specs:
  AUART:   { label: "오더유형",          sheet: "SALES ORDER TYPE",     max_len: 4 }
  VKORG:   { label: "판매조직",          sheet: "SALES ORG.",           max_len: 4, send_only: true }
  KUNNR1:  { label: "Sold-to",          code: KUNNR, sheet: "SOLD-TO PARTY",        max_len: 10 }
  KUNNR2:  { label: "Ship-to",          code: KUNWE, sheet: "SHIP-TO PARTY",        max_len: 10 }
  BSTKD:   { label: "고객발주번호",      sheet: "CUSTOMER PO",          max_len: 35 }
  POSEX:   { label: "PO품목번호",        sheet: "PO ITEM",              max_len: 6 }
  ZBRAND:  { label: "브랜드",            sheet: "BRAND",                max_len: 4 }
  ZSHCO:   { label: "Shipping Condition", sheet: "SHIPPING CONDITION",   max_len: 2 }
  KDMAT:   { label: "고객자재번호",      sheet: "YOUR CODE",            max_len: 35, added: "2026-09-30 템플릿 수정" }
  MATNR:   { label: "자재번호",          sheet: "MATERIAL",             max_len: 18 }
  KWMENG:  { label: "수량",              sheet: "ORDER QTY",            type: decimal }
  ZPKRE2:  { label: "Packing Spec",     code: ZPKRE, sheet: "PACKING REMARK",       max_len: 50 }
  EMPST:   { label: "Remark",           sheet: "REMARK",               max_len: 25 }
  VSART:   { label: "Shipping Type",    sheet: "SHIPPING TYPE",        max_len: 2 }
  PRICE:   { label: "단가",              sheet: "PRICE",                type: decimal }
  WAERK:   { label: "통화",              sheet: "CURRENCY",             max_len: 5 }

# ── 주의 ───────────────────────────────────────────────────────
# ZPKRE1/ZPKRE2/EMPST 는 코드값이 아니라 **자유 텍스트 비고**다.
#   (실물 예: ZPKRE2 = "C,Blue RING")
# 이전 설계의 "포장구분 코드" 해석은 오류였다.
