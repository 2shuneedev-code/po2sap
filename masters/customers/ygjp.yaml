# ═══════════════════════════════════════════════════════════════
#  YGJP / YG-1 Japan  (고객코드 3200)
#  스키마: masters/SCHEMA.md
# ═══════════════════════════════════════════════════════════════
version: 1

meta:
  code: YGJP
  name: "YG-1 Japan"
  customer_no: "3200"
  owner: "※ 지정 필요"
  status: draft
  file_types: [pdf]

extends: [_base/sap_defaults, profiles/standard]

extraction:
  input: text
  page_limit: 20
  hints: |
    YG-1 JAPAN 발주서 PDF다. 텍스트 추출 시 표의 컬럼 머리글이 한 줄로 붙어 나온다.
    일본어가 깨질 수 있으나 필요한 값은 대부분 영숫자다.

    [헤더]
      "Created On:  2026-05-18"       → po_date (원문 그대로)
      "Purchase Order ID:  10972"     → po_number  (YGJP 는 이것이 발주번호다)
      "Incoterms: CIP"                → incoterms_text
      "Payment Terms: ..." 뒤 문장     → payment_terms_text
      "Ship-to Address:" 뒤 주소 블록  → ship_to_text
      통화는 표 하단 "Total Value: 82,575 JPY" 의 통화표기

    [품목표] — 머리글이 이렇게 붙어서 나온다.
      NoProduct IDYour CodeProduct DimensionsDelivery dateQtyNet PriceNet Value
      1E24201502SE1515X16X30X952026-06-0515 1,189 17,835
      컬럼 순서대로 잘라 읽을 것:
        No            → line_no          (1)
        Product ID    → item_code        (E24201502SE)  ※ 우리 YG 품번 → MATNR
        Your Code     → our_item         (1515X16X30X95 앞부분… 구분 주의)
        Product Dimensions → description
        Delivery date → delivery_date    (2026-06-05)
        Qty           → quantity         (15)
        Net Price     → unit_price       (1,189)
        Net Value     → net_value        (17,835)
      값이 붙어 있어 경계가 애매하면 **날짜(YYYY-MM-DD) 패턴을 기준점**으로 삼을 것.
      "Total Quantities:" 줄 이후는 품목이 아니다.

    [문서 하단 — 브랜드/포장/비고 블록] ★
      Remark: #1 QNCT stock        ← 라인별 비고
      YG BRAND                     ← brand_text (원문 그대로. 코드로 바꾸지 말 것)
      S-Y,B-Y                      ← packing_spec (브랜드 바로 다음 줄)
      #1 ...                       ← 라인별 비고
      #2 ...
      규칙:
        · 브랜드 텍스트 바로 다음 줄 = packing_spec
        · "#N " 으로 시작하는 줄 = N번 라인 전용 비고 → line.remark
        · "#N" 없는 비고 줄 = 전 라인 공통 → header.remark_default

split:
  by: none

rules:
  brand_code:
    kind: csv_map
    label: "브랜드 판별"
    description: |
      발주서 원문을 참조표 refs/brand_keys.csv 의 이 거래처(kunnr) 행과 대조한다.
      매핑 추가·수정은 이 파일이 아니라 CSV 에서 한다 — 브랜드 관리 화면의 원천이다.
    source: header.brand_text
    table_file: refs/brand_keys.csv
    filter_column: kunnr
    key_column: text
    mode_column: match
    value_column: zbrand
    case_insensitive: true
    value_check:
      table_file: refs/brand_master.csv
      value_column: zbrand
      filter_column: kunnr
    on_no_match:
      action: error
      message: "브랜드를 인식하지 못했습니다: {brand_text}"

fields:
  # ── 표준 프로필(profiles/standard.yaml)과 **다른 것만** 선언한다 ──
  KUNNR2:  { from: const, value: "319854" }
  BSTKD:
    from: expr
    expr: 'join("-", ["01", date_yyyymmdd(header.po_date), header.po_number])'
    explain: '01-{발주일YYYYMMDD}-{Purchase Order ID}  예: 01-20260518-10972'
    required: true
  ZBRAND:  { from: rule,  rule: brand_code, required: true }
  ZSHCO:
    from: expr
    expr: 'if(in(brand_code, ["471", "507"]), "A", "L")'
    explain: '브랜드 코드가 471 또는 507 이면 A, 그 외 L'
  MATNR:   { from: doc,   path: line.item_code, required: true }
  ZPKRE2:  { from: doc,   path: header.packing_spec }
  EMPST:   { from: doc,   path: line.remark, fallback: header.remark_default }
  WAERK:   { from: const, value: "JPY" }

grid:
  pinned: [BSTKD, MATNR, KWMENG]
  hidden: [VTWEG, VBELN, VDATU, ZTERM, INCO1, INCO2, ZPKRE1, MAKTX, LGORT,
           ETDAT, BATCH, VALTY, PRICE, BSTDK_E, POSEX, DELCO, BSTKD_E,
           AUGRU, VKAUS, IHREZ_E, VGBEL, VGPOS]
  width:  { MATNR: 150, ZPKRE2: 140, EMPST: 200 }
