# ═══════════════════════════════════════════════════════════════
#  KL — Kennametal  (고객코드 107525)
#  스키마: masters/SCHEMA.md · 설계와 결정 근거: CUSTOMER_RULES.md §4.2
#
#  공용(profiles/standard.yaml)과 **다른 것만** 적는다:
#    · BSTKD = 발주번호에서 '/' 앞부분만 ("4507628839 / 040" → 4507628839)
#    · POSEX = 정수 ("00001" → 1)
#    · Packing Remark(ZPKRE) · Remark(EMPST) = 품목 Brand 원문
#      WIDIA GTD → WGT, KENNAMETAL → KMT, 둘 다 아니면 빈 칸
#  브랜드(ZBRAND)는 공용 드롭다운 그대로 — 전용 규칙 없음.
# ═══════════════════════════════════════════════════════════════
version: 1

meta:
  code: KL
  name: "Kennametal"
  customer_no: "107525"
  status: active
  file_types: [pdf]

extends: [_base/sap_defaults, profiles/standard]

extraction:
  input: text
  page_limit: 20
  hints: |
    Kennametal(KENNAMETAL INC) 발주서 PDF다. 여러 페이지에 걸친 품목표가 이어진다.

    [헤더]
      "Document No. 4507628839 / 040"  → po_number (원문 그대로. 슬래시와 뒤 번호까지)
      "Date 2026.05.11"                → po_date (원문 그대로)
      "Delivery Date 2026.09.14"       → requested_date (원문 그대로)
      "Terms of payment" 뒤 문장        → payment_terms_text
      "Terms of delivery" 뒤 문장       → incoterms_text
      "Shipping Address" 뒤 주소 블록   → ship_to_text

    [품목] — 품목표 머리글 "Item Material/Description Quantity UM Price Net Value"
      아래에 이런 블록이 반복된다.
        00001 Kennametal Mat. No.: 2748623 24 PC 8.24 197.76
        #12-28 UNF H3 ANSI 4FL HAND TAP SET HSS
        ANSI Cat. No. 15393
        ISO Cat. No. 15393
        Brand: WIDIA GTD
        MFG. Cat. No. 1015393

      첫 줄                : 품목번호 · Kennametal Mat. No. · 수량 · 단위 · 단가 · 금액
        line_no / posex    : 맨 앞 5자리 숫자 "00001" (원문 그대로)
        our_item           : "Kennametal Mat. No.:" 뒤의 번호 (2748623)
        quantity / unit    : 24 / PC
        unit_price         : 8.24
        net_value          : 197.76
      description          : 첫 줄 다음 줄 (품명)
      brand_text           : "Brand:" 뒤 원문 (WIDIA GTD / KENNAMETAL 등). 원문 그대로.

    [주의]
      - 품목 블록이 페이지에서 끊기면 다음 페이지 머리글("Page 2 of 7",
        "PO number/date", 품목표 머리글) 뒤에 **앞 품목의 나머지 줄**(품명·Brand 등)이
        이어진다. 품목번호(00002 등)로 시작하는 줄이 나올 때까지는 앞 품목의 것이다.
      - Brand 줄이 없는 품목은 직전 품목의 Brand 를 쓰지 말고 비워 둘 것.
      - "INSTRUCTIONS TO VENDOR" · "Authorized By" · "Total" 줄은 품목이 아니다.
      - 우리(YG) 품번은 이 발주서에 없다. item_code 는 비워 둘 것.

split:
  by: none

rules:
  po_base:
    kind: regex_extract
    label: "발주번호 — '/' 앞부분"
    description: |
      "4507628839 / 040" 에서 '/' 앞만 쓴다. '/' 가 없으면 전체를 쓴다.
    source: header.po_number
    pattern: '^\s*([^/]+?)\s*(?:/|$)'
    group: 1
    on_no_match:
      action: warn
      message: "발주번호 형식이 다릅니다: {po_number}"

  brand_mark:
    kind: keyword_map
    label: "Packing Remark · Remark — 품목 Brand 원문"
    description: |
      품목의 "Brand:" 원문에 WIDIA GTD 가 있으면 WGT, KENNAMETAL 이 있으면 KMT.
      둘 다 아니면 빈 칸 (경고 없음). 같은 값이 ZPKRE · EMPST 두 필드에 들어간다.
    source: line.brand_text
    case_insensitive: true
    entries:
      - { contains: "WIDIA GTD",  value: "WGT" }
      - { contains: "KENNAMETAL", value: "KMT" }
    on_no_match: { action: empty }

fields:
  # ── profiles/standard.yaml 과 **다른 것만** ──────────────────────
  BSTKD: { from: rule, rule: po_base, required: warn }
  POSEX: { from: doc, path: line.posex, format: integer }
  ZPKRE: { from: rule, rule: brand_mark }
  EMPST: { from: rule, rule: brand_mark }
