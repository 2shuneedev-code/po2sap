#  2026-09-23: 거래처 전용 규칙(ORDERED FROM 문구로 브랜드 판별 · 출하처별
#  KUNNR2 결정표 · 출하처별 오더 분할 · 참조표 포장비고 조회)을 걷어내고
#  기본(profiles/standard)만 쓴다. **의도적으로 비웠다** — 나중에 정리해서
#  다시 얹는다. 지운 규칙은 git 이력(이 커밋 이전)에 그대로 남아 있다.
# ═══════════════════════════════════════════════════════════════
version: 2

meta:
  code: MSC
  name: "MSC Industrial Supply"
  customer_no: "100249"
  owner: "※ 지정 필요"
  status: active
  file_types: [htm, html]

extends: [_base/sap_defaults, profiles/standard]

extraction:
  input: text
  page_limit: 40
  hints: |
    MSC Industrial 표준 발주서(HTM)다. 표는 전처리를 거쳐
    한 줄에 셀 | 셀 | 셀 형태로 넘어온다.

    [PO 번호]
      <title> 의 "PO#7588650" 또는 "Purchase Order #7588650" 의 숫자.

    [브랜드 원문]
      "ORDERED FROM" 블록의 첫 줄을 원문 그대로 담을 것. 코드로 바꾸지 말 것.
      예: "HERTEL (GP END MILLS) (APO)" / "ACCUPRO-CARBIDE DRILL MILL (AP"
      ※ 품명(Description)이 아니라 ORDERED FROM 에 있다.

    [출하처 — 두 가지 형태가 있다. 반드시 구분할 것] ★
      (A) 단일 출하처
          헤더 "SHIP TO" 블록에 창고명+주소가 그대로 있다.
          → shipments 1건. 상단 품목표가 그 shipment 의 품목이다.

      (B) 복수 출하처
          헤더 SHIP TO 가 "Check complete attachment for shipping instructions" 이고
          Receiving Location 이 "See Shipment" 이면 이 경우다.
          문서 하단에 아래 블록이 출하처 수만큼 반복된다.
              SHIP TO
              Shipment No.......:    001
              Receiving Loc.....:    ELK
              SID TOOL - ELKHART WAREHOUSE
              ...주소...
              (이어서 그 출하처 전용 품목표)
          → shipment 블록마다 별도 shipments 항목을 만들고,
            품목은 반드시 그 블록의 품목표에서 가져올 것.
          ※ 상단 요약 품목표는 전 출하처 합계다. 이것을 쓰지 말 것.
            상단 요약 품목표는 품목으로 읽지 않는다. 합계만 읽는다.

      창고명에 도시명(ATLANTA / ELKHART / HARRISBURG / RENO)이 들어 있고
      대소문자가 섞인다("SID TOOL Harrisburg Warehouse").
      주소의 도시는 다를 수 있으므로(ATLANTA 창고 → Mableton, GA)
      창고명 줄을 포함한 블록 전체를 ship_to_text 에 담을 것.

    [품목표] — 컬럼명이 MSC 기준이라 우리와 반대다. 혼동 금지 ★
      "Quantity Ordered"  → quantity
      "Our Item Number"   → our_item    (MSC 품번. 8자리 숫자)
      "Your Item Number"  → item_code   (우리 YG 품번)
      "Description"       → description
      "Price"             → unit_price  ("Line Cost" 합계금액과 혼동 금지)
      ※ shipment 블록 품목표에는 Price 컬럼이 없다. 없으면 비워 둘 것.

    [기타]
      "Date of Order" / "Ship on Or Before" 는 M/D/YY(2/17/26). 원문 그대로.
      "P.O Priced In" 은 "United States Dollars" 같은 문장. 원문 그대로.
      페이지마다 표 머리글이 반복된다. 머리글을 품목으로 넣지 말 것.

split:
  by: shipment
  label: "출하처(Shipment)별로 오더를 나눈다"
  description: |
    MSC 발주서 1부가 출하처 수만큼의 오더로 쪼개진다. 화면에는 한 그리드로
    통합해 보여준다. (출하처별 KUNNR2·BSTKD 결정 로직은 걷어냈다 — 나중에
    정리해서 다시 얹는다. 지금은 둘 다 전 출하처에서 같은 기본값이다.)
