# 사내 업무 화면 — 장식보다 밀도와 가독성.
[theme]
primaryColor = "#1f5fd0"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6f8"
textColor = "#1b2027"
font = "sans serif"

[server]
# 발주서 여러 개를 한 번에 올린다. 계약 §4 의 합계 한도(100MB)와 맞춘다.
maxUploadSize = 100

# ★ 끄지 말 것. false 면 스트림릿이 첫 실행에 이메일을 물어보고 **입력을 기다리며
#   멈춘다.** 사내 서버에서 nohup·서비스로 띄우면 화면이 영영 안 뜬다.
#   대신 로컬에서 브라우저가 자동으로 열리지 않으니, 뜨는 URL 을 직접 연다.
headless = true

[browser]
gatherUsageStats = false

[client]
# 우상단 스트림릿 기본 툴바에서 **개발자용 버튼을 없앤다** — Deploy · Rerun ·
# Clear cache. 현업이 쓰는 업무 화면이고, 그 버튼들은 우리 배포와 아무 관계가
# 없으면서 눌러볼 여지만 준다. 인쇄·테마 같은 보기 옵션은 남는다.
# (개발 중 재시작은 터미널에서 Ctrl+C 로 한다)
toolbarMode = "viewer"
