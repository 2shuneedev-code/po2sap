# ═══════════════════════════════════════════════════════════════
#  MSC Industrial Supply  (고객코드 100249)
#  스키마: masters/SCHEMA.md
#
#  2026-09-23: 거래처 전용 규칙(ORDERED FROM 문구로 브랜드 판별 · 참조표
#  포장비고 조회)을 걷어내고 기본(profiles/standard)만 쓴다. **의도적으로
#  비웠다** — 나중에 정리해서 다시 얹는다. 지운 규칙은 git 이력(이 커밋
#  이전)에 그대로 남아 있다.
#
#  2026-09-23(같은 날, 2차): **출하처별 SHIP-TO PARTY(KUNNR2) 결정**만
#  실물 테스트 전에 먼저 다시 얹었다 — 출하처마다 실제로 다른 SAP 고객
#  (KUNNR2)로 나가야 하는 업무 규칙이라 기본값(KUNNR2=KUNNR)으로는 오더가
#  잘못된 곳으로 간다. 브랜드·BSTKD·포장비고는 여전히 기본만 쓴다.
# ═══════════════════════════════════════════════════════════════
version: 2

meta:
  code: MSC
  name: "MSC Industrial Supply"
  customer_no: "100249"
  owner: "※ 지정 필요"
  status: active
  file_types: [htm, html]

extends: [_base/sap_defaults, profiles/standard]

extraction:
  input: text
  page_limit: 40
  hints: |
    MSC Industrial 표준 발주서(HTM)다. 표는 전처리를 거쳐
    한 줄에 셀 | 셀 | 셀 형태로 넘어온다.

    [PO 번호]
      <title> 의 "PO#7588650" 또는 "Purchase Order #7588650" 의 숫자.

    [브랜드 원문]
      "ORDERED FROM" 블록의 첫 줄을 원문 그대로 담을 것. 코드로 바꾸지 말 것.
      예: "HERTEL (GP END MILLS) (APO)" / "ACCUPRO-CARBIDE DRILL MILL (AP"
      ※ 품명(Description)이 아니라 ORDERED FROM 에 있다.

    [출하처 — 두 가지 형태가 있다. 반드시 구분할 것] ★
      (A) 단일 출하처
          헤더 "SHIP TO" 블록에 창고명+주소가 그대로 있다.
          → shipments 1건. 상단 품목표가 그 shipment 의 품목이다.

      (B) 복수 출하처
          헤더 SHIP TO 가 "Check complete attachment for shipping instructions" 이고
          Receiving Location 이 "See Shipment" 이면 이 경우다.
          문서 하단에 아래 블록이 출하처 수만큼 반복된다.
              SHIP TO
              Shipment No.......:    001
              Receiving Loc.....:    ELK
              SID TOOL - ELKHART WAREHOUSE
              ...주소...
              (이어서 그 출하처 전용 품목표)
          → shipment 블록마다 별도 shipments 항목을 만들고,
            품목은 반드시 그 블록의 품목표에서 가져올 것.
          ※ 상단 요약 품목표는 전 출하처 합계다. 이것을 쓰지 말 것.
            상단 요약 품목표는 품목으로 읽지 않는다. 합계만 읽는다.

      창고명에 도시명(ATLANTA / ELKHART / HARRISBURG / RENO)이 들어 있고
      대소문자가 섞인다("SID TOOL Harrisburg Warehouse").
      주소의 도시는 다를 수 있으므로(ATLANTA 창고 → Mableton, GA)
      창고명 줄을 포함한 블록 전체를 ship_to_text 에 담을 것.

    [품목표] — 컬럼명이 MSC 기준이라 우리와 반대다. 혼동 금지 ★
      "Quantity Ordered"  → quantity
      "Our Item Number"   → our_item    (MSC 품번. 8자리 숫자)
      "Your Item Number"  → item_code   (우리 YG 품번)
      "Description"       → description
      "Price"             → unit_price  ("Line Cost" 합계금액과 혼동 금지)
      ※ shipment 블록 품목표에는 Price 컬럼이 없다. 없으면 비워 둘 것.

    [기타]
      "Date of Order" / "Ship on Or Before" 는 M/D/YY(2/17/26). 원문 그대로.
      "P.O Priced In" 은 "United States Dollars" 같은 문장. 원문 그대로.
      페이지마다 표 머리글이 반복된다. 머리글을 품목으로 넣지 말 것.

split:
  by: shipment
  label: "출하처(Shipment)별로 오더를 나눈다"
  group_label: _city
  description: |
    MSC 발주서 1부가 출하처 수만큼의 오더로 쪼개진다. 화면에는 한 그리드로
    통합해 보여주고, 출하처마다 KUNNR2(SHIP-TO PARTY)가 달라진다. BSTKD·
    포장비고는 아직 기본값만 쓴다 — 나중에 정리해서 다시 얹는다.

tables:
  ship_to_routing:
    label: "출하처(Ship To) → SHIP-TO PARTY(KUNNR2) 분기"
    scope: shipment
    description: |
      출하처 창고 도시명으로 그 오더가 실려 나갈 SAP 고객(KUNNR2)을 정한다.
      확인된 값 — ATLANTA/ELKHART/HARRISBURG/RENO 외 도시는 아직 모른다.
    when:
      - source: shipment.ship_to_text
        fallback_source: header.ship_to_text
        op: contains_ci
        label: "출하처 블록에 포함"
    then: [KUNNR2, _city]
    rows:
      - { when: ["ELKHART"], then: ["100249", "ELKHART"] }
      - { when: ["HARRISBURG"], then: ["319677", "HARRISBURG"] }
      - { when: ["RENO"], then: ["319678", "RENO"] }
      - { when: ["ATLANTA"], then: ["319679", "ATLANTA"] }
    on_no_match:
      action: error
      message: "출하처 도시를 인식하지 못했습니다 (ATLANTA / ELKHART / HARRISBURG / RENO) — 잘못된 SAP 고객으로 나갈 수 있어 전송을 막습니다"

fields:
  # ── 표준 프로필(profiles/standard.yaml)과 **다른 것만** 선언한다 ──
  KUNNR2: { from: table, table: ship_to_routing }
