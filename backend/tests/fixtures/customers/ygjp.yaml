#  스키마: masters/SCHEMA.md
#
#  2026-09-23: 거래처 전용 규칙(SAP 브랜드명 원문대조 · ZSHCO 브랜드분기
#  · BSTKD 조립식 · 통화 고정)을 걷어내고 기본(profiles/standard)만 쓴다.
