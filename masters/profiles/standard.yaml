# ═══════════════════════════════════════════════════════════════
#  표준 프로필 — 대부분의 거래처가 그대로 쓰는 전송 필드 매핑
#
#  거래처 파일은 `extends: [_base/sap_defaults, profiles/standard]` 로 이것을 깔고
#  **다른 것만** 덮어쓴다. 전량 선언(SCHEMA §4.6)은 병합 결과 기준으로 검사하므로
#  거래처 파일에서 36개를 다시 적을 필요가 없다.
#
#  여기에 값을 넣는 기준:
#    · 거래처 3곳 이상에서 같은 값이면 올린다
#    · 한 곳이라도 다르면 그 거래처가 덮어쓴다 (병합은 거래처 우선)
#    · **거래처 고유값을 여기 넣지 않는다** — 고객코드는 meta.customer_no 로 받는다
#
#  스키마: masters/SCHEMA.md §4.6
# ═══════════════════════════════════════════════════════════════
version: 1

fields:
  # ── 공통 고정값 (_base/sap_defaults.yaml 의 sap_defaults) ──────
  AUART:   { from: base }
  VKORG:   { from: base }
  VTWEG:   { from: base }

  # ── 거래처 식별 — meta 에서 받는다 ────────────────────────────
  # 판매처·최종고객은 고객코드 그대로다. 출하처(KUNNR2)는 거래처마다
  # 다르므로(결정표/고정값) 여기 두지 않는다.
  # 셋 다 기본은 고객코드와 같은 값이다. 다른 거래처는 그 파일에서 덮어쓴다
  # (MSC 는 출하처에 따라 KUNNR2 가 달라져 결정표를 건다).
  KUNNR1:  { from: expr, expr: 'meta.customer_no', required: true }
  KUNNR2:  { from: expr, expr: 'meta.customer_no', required: warn }
  KUNNR3:  { from: expr, expr: 'meta.customer_no', required: true }

  # ═══════════════════════════════════════════════════════════
  #  기본 매핑표 — 표준 키 → SAP 필드
  #
  #  **Claude 는 발주서를 고정 표준 키로 읽는다.** 문서가 "PO No" 든
  #  "Order No" 든 "발주번호" 든 전부 `header.po_number` 로 들어온다.
  #  그 표준 키를 어느 SAP 필드로 보낼지는 **여기서 한 번만 정한다.**
  #
  #  거래처는 **다른 것만** 덮어쓴다. 같은 값을 다시 적지 않는다.
  #  (표준 키 목록은 masters/SCHEMA.md §3.1 이 원천이다)
  # ═══════════════════════════════════════════════════════════

  # ── 헤더에서 오는 값 ──────────────────────────────────────────
  BSTKD:   { from: doc, path: header.po_number,      required: warn }
  BSTDK_E: { from: doc, path: header.po_date,        format: date_yyyymmdd }
  VDATU:   { from: doc, path: header.requested_date, format: date_yyyymmdd }
  # ★ ZTERM · INCO1 · WAERK 는 **SAP 코드 필드**다. 발주서에는 자유 텍스트가
  #   적혀 있어(“NET 30” · “United States Dollars”) 그대로 넣으면 길이 초과로
  #   전송이 막힌다. 실제로 그렇게 터지는 것을 확인했다 (2026-09-21).
  #   원문 → 코드 변환표가 생기면 `csv_map` 조회로 바꾼다. **추측해 채우지 않는다.**
  ZTERM:   { from: const, value: "", required: warn,
             todo: "지급조건 — 원문(NET 30) → SAP 코드 변환표 필요" }
  INCO1:   { from: const, value: "", required: warn,
             todo: "인도조건 — 원문(FCA) → SAP 코드 확인 필요" }
  WAERK:   { from: const, value: "", required: warn,
             todo: "통화 — 원문(United States Dollars) → USD 변환표 필요" }
  ZPKRE1:  { from: doc, path: header.remark_default }
  ZPKRE2:  { from: doc, path: header.packing_spec }

  # ── 품목에서 오는 값 ──────────────────────────────────────────
  # ★ MATNR 은 **우리 품번**(item_code)이다. 고객 품번(our_item)이 아니다.
  #   거래처에 따라 발주서 컬럼명이 반대인 곳이 있다 (MSC: "Your Item
  #   Number" 가 우리 품번). 여기서 한 번 고정해 두면 그 혼동이 사라진다.
  MATNR:   { from: doc, path: line.item_code,     required: warn }
  MAKTX:   { from: doc, path: line.description }
  KWMENG:  { from: doc, path: line.quantity, format: integer, required: true }
  PRICE:   { from: doc, path: line.unit_price }
  POSEX:   { from: doc, path: line.posex }
  ETDAT:   { from: doc, path: line.delivery_date, format: date_yyyymmdd }
  EMPST:   { from: doc, path: line.remark }

  # ── 마스터가 정한다 (문서에서 읽지 않는다) ────────────────────
  # ★ 아직 마스터가 없다. 만들 때까지 현행 값을 그대로 둔다.
  #   추측해 채우지 않는다 — 빈 칸은 눈에 띄지만 그럴듯한 값은 안 띈다.
  VSART:   { from: const, value: "04", explain: "운송수단 — 전 거래처 04" }
  ZSHCO:   { from: const, value: "", required: warn,
             todo: "refs/shipping.csv (고객 1:1:1) 를 만들어 조회로 바꾼다" }
  ZBRAND:  { from: const, value: "", required: warn,
             todo: "브랜드 마스터 조회로 바꾼다 — 1개면 기본값, 2개 이상이면 드롭다운" }

  # ── 채우지 않는다 (양식에는 있으나 우리가 보낼 값이 없다) ──────
  # 전송 JSON 에는 "" 로 들어간다. 필요해지면 거래처 파일에서 덮어쓴다.
  # **추측해서 채우지 않는다** — 빈 칸은 눈에 띄지만 그럴듯한 값은 안 띈다.
  VBELN:   { from: const, value: "" }
  INCO2:   { from: const, value: "" }
  LGORT:   { from: const, value: "" }
  BATCH:   { from: const, value: "" }
  VALTY:   { from: const, value: "" }
  DELCO:   { from: const, value: "" }
  BSTKD_E: { from: const, value: "" }
  AUGRU:   { from: const, value: "" }
  VKAUS:   { from: const, value: "" }
  IHREZ_E: { from: const, value: "" }
  VGBEL:   { from: const, value: "" }
  VGPOS:   { from: const, value: "" }

grid:
  pinned: [BSTKD, MATNR, KWMENG]
  hidden: [VTWEG, VBELN, VDATU, ZTERM, INCO1, INCO2, ZPKRE1, MAKTX, LGORT,
           ETDAT, BATCH, VALTY, PRICE, WAERK, BSTDK_E, DELCO, BSTKD_E,
           AUGRU, VKAUS, IHREZ_E, VGBEL, VGPOS]
  width:  { MATNR: 140 }
