[project]
name = "po2sap"
version = "0.1.0"
description = "발주서(PDF/HTM) → Claude 추출 → 규칙엔진 → 검수 → EAI(JSON) 전송 → SAP CBO"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.dynamic]
dependencies = { file = ["backend/requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "storage"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # 줄 길이는 line-length 로만 본다 (한글 주석 정렬 때문)
    "SIM108",  # 삼항 강제는 가독성을 해치는 경우가 있다
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["E402"]     # 테스트는 경로 세팅 후 import 하는 경우가 있다
"scripts/*" = ["E402"]           # sys.path 조정 후 import (파일 상단에 명시)
