version: 1

meta:
  code: KL
  name: "Kennametal"
  customer_no: "107525"
  owner: "※ 지정 필요"
  status: draft
  file_types: [pdf]

extends: [_base/sap_defaults, profiles/standard]

extraction:
  input: text
  page_limit: 20
  hints: |
    Kennametal(KENNAMETAL INC) 발주서 PDF다.
    PDF 텍스트 추출 결과가 상당히 뭉개져서 나온다. 라벨 뒤에 값이 공백 없이
    붙거나, 다음 품목의 시작이 앞 줄 끝에 붙는다. 라벨을 기준으로 잘라 읽을 것.

    [헤더]
      "Document No.  4507628839 / 040"  → po_number 는 슬래시 앞의 "4507628839"
      "Date  2026.05.11"                → po_date (원문 그대로)
      "Delivery Date 2026.09.14"        → 헤더 납기
      "Terms of payment" 뒤 문장         → payment_terms_text
      "Terms of delivery" 뒤 문장        → incoterms_text
      "Shipping Address" 뒤 주소 블록    → ship_to_text

    [품목] — 아래 형태의 블록이 반복된다.
      00001Kennametal Mat. No.: 2748623
      #12-28 UNF H3 ANSI 4FL HAND TAP SET HSS
      ANSI Cat. No. 15393
      ISO Cat. No. 15393
      Brand: WIDIA GTD
      MFG. Cat. No. 101539324PC8.24 197.76

      line_no/posex : 블록 앞의 5자리 숫자 "00001"
      our_item      : "Kennametal Mat. No.:" 뒤의 번호 (2748623)
      description   : 그 다음 줄 (품명)
      brand_text    : "Brand:" 뒤 원문 (WIDIA GTD / KENNAMETAL 등). 원문 그대로.
      quantity / unit_price / net_value :
        마지막 줄 끝에 "24PC8.24 197.76" 처럼 **붙어서** 나온다.
        → 수량 24, 단위 PC, 단가 8.24, 금액 197.76
        "MFG. Cat. No." 번호와 수량이 이어 붙으므로 주의 (…1015393|24|PC|8.24|197.76)

    [주의]
      - 페이지가 넘어가면 "ItemMaterial/DescriptionQuantityUM Unit PriceNet Value"
        머리글이 다시 나오고, **앞 품목의 나머지 줄이 그 뒤에 이어진다.**
        품목번호(00002 등)를 기준으로 소속을 판단할 것.
      - Brand 줄이 없는 품목은 직전 품목의 Brand 를 쓰지 말고 비워 둘 것.
      - "Total"/"INSTRUCTIONS TO VENDOR"/"Authorized By" 이후는 품목이 아니다.
      - 우리(YG) 품번은 이 발주서에 없다. item_code 는 비워 둘 것.

split:
  by: none
