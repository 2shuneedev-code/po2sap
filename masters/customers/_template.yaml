# ═══════════════════════════════════════════════════════════════
#  신규 거래처 템플릿 — 이 파일을 복사해서 <거래처코드>.yaml 로 만든다.
#  스키마 정의: masters/SCHEMA.md
#  값이 미정이면 비워 두고 todo: 를 달아라. 개발은 그대로 진행된다.
# ═══════════════════════════════════════════════════════════════
version: 1

meta:
  code: XXX
  name: ""
  customer_no: ""
  owner: "※ 지정 필요"
  status: draft            # draft 는 화면 거래처 목록에 안 뜬다
  file_types: [pdf]

extends: [_base/sap_defaults, profiles/standard]

extraction:
  input: text
  page_limit: 20
  hints: |
    (샘플 발주서를 보면서 문서 구조를 자연어로 설명한다.
     - 어떤 라벨 아래 어떤 값이 있는지
     - 혼동하기 쉬운 컬럼이 무엇인지
     - 품목표의 시작/끝을 어떻게 아는지
     값 변환 지시는 쓰지 않는다. 원문 그대로 읽게 한다.)

split:
  by: none                 # none | shipment

# tables:                  # 분기(결정표)가 있으면 작성. 없으면 통째로 생략.
#   my_table:
#     scope: header
#     when: [{ source: header.ship_to_text, op: contains_ci }]
#     then: [KUNNR2, _pack_base]
#     rows:
#       - { when: ["CITY"], then: ["123456", "X"] }
#     on_no_match: { action: error, message: "" }

# rules:                   # 매핑 규칙이 있으면 작성.
#   brand_code:
#     kind: keyword_map
#     source: header.brand_text
#     entries: [{ contains: "", value: "" }]
#     on_no_match: { action: error, message: "" }

# ── 전송 필드는 전부 선언해야 한다 (누락 시 검증 실패) ─────────
fields:
  # ── profiles/standard.yaml 과 **다른 것만** 적는다 ────────────────
  #  36개를 다시 나열하지 않는다. 병합 결과가 전량을 채우면 검증을 통과한다.
  #  아래 다섯 개는 거의 모든 거래처가 덮어써야 한다 — 그대로 두면
  #  프로필의 todo 가 남아 validate_masters 리포트에 뜬다 (막지는 않는다).

  KUNNR2:  { from: const, value: "", todo: "출하처 코드" }
  BSTKD:   { from: doc,   path: header.po_number, required: true }
  ZBRAND:  { from: const, value: "", todo: "브랜드 — 고정값이면 const, 원문 판정이면 rule" }
  ZSHCO:   { from: const, value: "", todo: "출하조건" }
  MATNR:   { from: doc,   path: line.item_code, required: true }

  # 필요할 때만 추가로 덮어쓴다 (기본값은 프로필에 있다)
  # ZPKRE2:  { from: doc,   path: header.packing_spec }
  # EMPST:   { from: doc,   path: line.remark, fallback: header.remark_default }
  # POSEX:   { from: doc,   path: line.posex, format: integer }
  # WAERK:   { from: const, value: "USD" }

# grid:                    # 화면 배치가 프로필과 다를 때만 작성.
#   pinned: [BSTKD, MATNR, KWMENG]
#   hidden: [...]          # 리스트는 병합되지 않는다 — 전체를 다시 적는다
#   width:  { MATNR: 140 }
